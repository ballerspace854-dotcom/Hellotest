y="0" width="720" height="1280" xlink:href="../assets/mochi-after-frame.png"/></svg></g><text font-family="Liberation Sans" font-size="36" font-weight="700" fill="#181B1D" text-anchor="start"><tspan x="64" y="939.96">“Our vet recommended six weeks of crate rest. We</tspan><tspan x="64" y="981.36">added PAWZI at week two. By week four she was</tspan><tspan x="64" y="1022.76">walking to her bowl without hesitation.”</tspan></text><text font-family="Liberation Sans" font-size="25" font-weight="400" fill="#C5263B" text-anchor="start"><tspan x="64" y="1070.7">Mochi’s owner · Customer story on Pawzi</tspan></text><line x1="64" y1="1204" x2="676" y2="1204" stroke="#C5263B" stroke-width="4"/><rect x="746" y="1199" width="270" height="68" rx="0" fill="#C5263B"/><text font-family="Liberation Sans" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="768" y="1241.08">See the pad</tspan></text><path d="M 981 1225.0 L 989 1233.0 L 981 1241.0" fill="none" stroke="#FFFFFF" stroke-width="3"/><text font-family="Liberation Sans" font-size="22" font-weight="400" fill="#181B1D" text-anchor="start"><tspan x="64" y="1309.92">Individual results vary. Follow your vet’s crate-rest schedule.</tspan></text></svg>